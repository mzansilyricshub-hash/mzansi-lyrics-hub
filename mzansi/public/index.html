async function use(c){const r=await api("use",{password:pw,code:c});$("#res").innerHTML=r.result==="marked"?`<div class="res ok">Marked as used ✓</div>`:`<div class="res warn">Already used</div>`;codes()}
async function inbox(){
 const r=await api("tickets",{password:pw});const L=r.tickets||[];const n=L.filter(t=>t.status==="new").length;
 $("#ibn").textContent=n?`(${n} new)`:"";
 $("#ib").innerHTML=L.length?L.map(t=>`<div class="tk ${t.status}"><span class="tag ${t.type==="report"?"r":t.type==="join"?"":"y"}">${t.type}</span> <b>${esc(t.name||"No name")}</b> <span class="meta">${fd(t.created)}${t.role?" · "+esc(t.role):""} · ${t.status}</span><div class="body">${esc(t.message)}</div><a class="btn" href="mailto:${esc(t.email)}?subject=${encodeURIComponent("Re: MzansiLyrics "+t.type)}">Reply to ${esc(t.email)}</a><button class="btn g" onclick="tk('ticketdone','${t.id}')">${t.status==="answered"?"Reopen":"Mark answered"}</button><button class="btn r" onclick="if(confirm('Delete?'))tk('ticketdel','${t.id}')">Delete</button></div>`).join(""):`<span class="meta">No messages yet</span>`;
}
async function tk(a,id){await api(a,{password:pw,id});inbox()}
async function post(){
 const r=await api("post",{password:pw,type:$("#t").value,title:$("#ti").value,cat:$("#ca").value,artist:$("#ar").value,src:$("#sr").value,url:$("#ur").value,body:$("#bo").value});
 if(r.ok){$("#pm").textContent=" Published ✓";$("#ti").value=$("#ca").value=$("#ar").value=$("#sr").value=$("#ur").value=$("#bo").value="";manage()}
}
async function manage(){
 DATA=await api("content");
 $("#mg").innerHTML=TABS.slice(0,3).flatMap(([k,l])=>DATA[k].map(x=>`<div class="row2"><span><span class="meta">${l}</span> ${esc(x.title)}</span><button class="btn r" onclick="del('${k}','${x.id}')">Delete</button></div>`)).join("")||`<span class="meta">No posts yet</span>`;
}
async function del(t,id){if(confirm("Delete this post?")){await api("delete",{password:pw,type:t,id});manage()}}
async function codes(){
 const r=await api("list",{password:pw});
 $("#ls").innerHTML=r.codes?.length?`<div style="overflow-x:auto"><table><tr><th>Code</th><th>Name</th><th>Package</th><th>Status</th></tr>${r.codes.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.pkg)}</td><td class="${x.status==="used"?"warn":"ok"}">${x.status}</td></tr>`).join("")}</table></div>`:`<span class="meta">No codes yet</span>`;
}
nav();render();
(function(){const t=[...SEED.alerts.map(x=>"🚨 "+x.title),...SEED.news.slice(0,5).map(x=>"📰 "+x.title)].join("      •      ");$("#tkr").textContent=t})();
</script>
</body>
